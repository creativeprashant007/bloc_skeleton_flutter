name: stock_control_master
description: "Stock Control Master"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  shared_preferences: ^2.5.4
  flutter_screenutil: ^5.9.3
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
  logger: ^2.6.2
  equatable: ^2.0.8
  hive: ^2.2.3
  geolocator: ^14.0.2
  awesome_dio_interceptor: ^1.3.0
  connectivity_plus: ^7.0.0
  flutter_svg: ^2.2.4
  pinput: ^6.0.2
  smooth_page_indicator: ^2.0.1
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0
  flutter_spinkit: ^5.2.2
  lottie: ^3.3.2
  get_it: ^9.2.1
  country_code_picker: ^3.4.1
  
  cached_network_image: ^3.4.1
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  google_sign_in: ^7.2.0
  
  sign_in_with_apple: ^8.0.0
  google_maps_flutter: ^2.17.0
  intl: ^0.20.2
  flutter_localization: ^0.4.0

  flutter_localizations:
    sdk: flutter

  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0
  rename: ^3.1.0
  upgrader: ^13.3.0
  firebase_analytics: ^12.4.1
  firebase_crashlytics: ^5.2.2
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.2
  image_cropper: ^12.2.1
  omni_datetime_picker: ^2.3.2
  syncfusion_flutter_datepicker: ^33.2.12
  package_info_plus: ^10.1.0
  webview_flutter: ^4.14.0
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/pngs/app_icon.png"
  image_path_ios: "assets/pngs/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  image: assets/pngs/logo.png
  color: "#F8FBFD"
  android: true
  ios: true
  web: false
  fullscreen: false

  android_12:
    color: "#ffffff"
    image: assets/pngs/logo.png

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/vectors/
    - assets/images/
    - assets/anims/
    - assets/jpgs/
    - assets/pngs/
    - assets/svgs/
    - assets/lottie/

  fonts:

    # POPPINS
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Thin.ttf
          weight: 100

        - asset: assets/fonts/Poppins/Poppins-ExtraLight.ttf
          weight: 200

        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300

        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400

        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500

        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700

        - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
          weight: 800

        - asset: assets/fonts/Poppins/Poppins-Black.ttf
          weight: 900

    # INTER
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Thin.ttf
          weight: 100

        - asset: assets/fonts/inter/Inter-ExtraLight.ttf
          weight: 200

        - asset: assets/fonts/inter/Inter-Light.ttf
          weight: 300

        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400

        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500

        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700

        - asset: assets/fonts/inter/Inter-ExtraBold.ttf
          weight: 800

        - asset: assets/fonts/inter/Inter-Black.ttf
          weight: 900